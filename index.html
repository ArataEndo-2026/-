<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="個人情報取扱主任者の試験対策用の一問一答（虫食い・○×）。ローカルだけで動きます。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2324456e'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='serif'%3E個%3C/text%3E%3C/svg%3E">
<title>個人情報取扱主任者 一問一答</title>
<style>
  :root{
    --paper:#eef0f3;
    --card:#ffffff;
    --ink:#16212e;
    --ink-soft:#5b6675;
    --rule:#d2d8e0;
    --ai:#24456e;          /* 藍：UIのアクセント */
    --ai-weak:#e4eaf3;
    --ok:#0f6b52;
    --ok-weak:#e3f2ec;
    --ng:#a3283a;
    --ng-weak:#fbe9eb;
    --blank:#fdf4d6;
    --note-bg:#f7f8fa;
    --ai-hover:#1b3a5c;
    --on-ai:#ffffff;
    --mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic: "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  }
  /* 夜に紙面を眺めても眩しくないように、色だけ差し替える */
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#151a21;
      --card:#1d242e;
      --ink:#e6eaef;
      --ink-soft:#98a3b2;
      --rule:#333e4c;
      --ai:#8fb4e3;
      --ai-weak:#26364b;
      --ok:#6fd3ac;
      --ok-weak:#1d332c;
      --ng:#f09aa6;
      --ng-weak:#3a252a;
      --blank:#3b3524;
      --note-bg:#222a35;
      --ai-hover:#a6c6ee;
      --on-ai:#10161d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--gothic);
    line-height:1.7;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- ヘッダー ---------- */
  header{
    background:var(--card);
    border-bottom:1px solid var(--rule);
    position:sticky; top:0; z-index:10;
  }
  .head-inner{max-width:820px;margin:0 auto;padding:14px 20px 10px}
  .head-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{
    font-family:var(--mincho);
    font-size:1.15rem; font-weight:600; letter-spacing:.04em;
    margin:0;
  }
  .score{font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .bar{height:3px;background:var(--ai-weak);border-radius:2px;margin-top:10px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--ai);width:0;transition:width .25s ease}

  .settings{
    max-width:820px;margin:0 auto;padding:0 20px 12px;
    display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;
    font-size:.82rem;color:var(--ink-soft);
  }
  .settings label{display:inline-flex;align-items:center;gap:6px}
  select{
    font-family:inherit;font-size:.82rem;color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:4px 6px;
  }
  input[type=checkbox]{accent-color:var(--ai)}

  /* ---------- 本体 ---------- */
  main{max-width:820px;margin:0 auto;padding:22px 20px 120px}
  .meta{display:flex;gap:10px;align-items:center;font-size:.78rem;color:var(--ink-soft);margin-bottom:8px}
  .tag{border:1px solid var(--rule);border-radius:3px;padding:1px 7px;background:var(--card)}
  .qno{font-variant-numeric:tabular-nums}

  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:26px 28px 28px;
    box-shadow:0 1px 0 rgba(22,33,46,.04);
  }
  h2{
    font-size:.95rem;font-weight:600;margin:0 0 18px;
    padding-bottom:12px;border-bottom:1px solid var(--rule);
    letter-spacing:.02em;
  }
  .body{
    font-family:var(--mincho);
    font-size:1.02rem;
    line-height:2.15;
    white-space:pre-wrap;
    text-align:justify;
  }

  /* ---------- 空欄 ---------- */
  .blankwrap{display:inline-flex;align-items:baseline;white-space:nowrap;margin:0 2px}
  .lab{
    font-family:var(--gothic);font-size:.68rem;color:var(--ai);
    background:var(--ai-weak);border-radius:3px;padding:1px 4px;margin-right:3px;
    position:relative;top:-.35em;
  }
  input.blank{
    font-family:var(--mincho);font-size:1rem;color:var(--ink);
    background:var(--blank);
    border:0;border-bottom:1.5px solid var(--ai);
    padding:1px 4px;min-width:4.5em;
    border-radius:2px 2px 0 0;
  }
  input.blank:focus{outline:2px solid var(--ai);outline-offset:1px}
  input.blank.ok{background:var(--ok-weak);border-bottom-color:var(--ok);color:var(--ok)}
  input.blank.ng{background:var(--ng-weak);border-bottom-color:var(--ng);color:var(--ng);text-decoration:line-through}

  /* ---------- ○× ---------- */
  .oxrow{display:flex;gap:14px;margin-top:24px}
  .oxbtn{
    flex:1;font-family:var(--mincho);font-size:1.8rem;
    padding:14px 0;background:var(--card);color:var(--ink);
    border:1px solid var(--rule);border-radius:6px;cursor:pointer;
  }
  .oxbtn:hover:not(:disabled){border-color:var(--ai);color:var(--ai)}
  .oxbtn:disabled{cursor:default;opacity:.55}
  .oxbtn.picked{border-color:var(--ai);background:var(--ai-weak);color:var(--ai);opacity:1}
  .oxbtn.truth{border-color:var(--ok);background:var(--ok-weak);color:var(--ok);opacity:1}
  .oxbtn.wrong{border-color:var(--ng);background:var(--ng-weak);color:var(--ng);opacity:1}

  /* ---------- 判定・解説 ---------- */
  .result{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
  .verdict{font-size:.95rem;font-weight:600;margin-bottom:14px}
  .verdict.ok{color:var(--ok)}
  .verdict.ng{color:var(--ng)}
  .keys{list-style:none;margin:0 0 16px;padding:0;font-size:.9rem}
  .keys li{padding:5px 0;border-bottom:1px dotted var(--rule);display:flex;gap:10px;flex-wrap:wrap}
  .keys li:last-child{border-bottom:0}
  .keys .n{color:var(--ai);font-size:.78rem;min-width:2.2em;padding-top:.2em}
  .keys .a{font-family:var(--mincho);font-weight:600}
  .keys .mine{color:var(--ng);font-size:.8rem}
  .note{
    font-size:.88rem;line-height:1.85;color:var(--ink);
    background:var(--note-bg);border-left:3px solid var(--ai);
    padding:12px 14px;border-radius:0 4px 4px 0;white-space:pre-wrap;
  }
  .note b{font-weight:600}
  .warn{
    font-size:.85rem;color:var(--ng);background:var(--ng-weak);
    border-left:3px solid var(--ng);padding:9px 12px;border-radius:0 4px 4px 0;
    margin-top:20px;
  }
  .retry{
    font-family:inherit;font-size:.8rem;padding:6px 12px;margin-top:4px;
    background:var(--card);color:var(--ai);border:1px solid var(--ai);
    border-radius:5px;cursor:pointer;
  }
  .retry:hover{background:var(--ai-weak)}

  /* ---------- データ不備の通知（問題を追記したときの書き間違い用） ---------- */
  .issues{
    max-width:820px;margin:16px auto 0;padding:12px 16px;
    background:var(--ng-weak);border:1px solid var(--ng);border-radius:6px;
    color:var(--ng);font-size:.85rem;line-height:1.7;
  }
  .issues ul{margin:6px 0 0;padding-left:1.3em}

  /* ---------- 成績の記録（復習リスト・項目別） ---------- */
  .meta .stat{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
  .meta .stat.hot{color:var(--ng)}
  .tag.review{border-color:var(--ng);color:var(--ng);background:var(--ng-weak)}
  /* 採点後に「あと何回連続正解で外れるか」を出す。手が届く距離を見せるため */
  .streak{
    font-size:.82rem;color:var(--ink-soft);margin:0 0 14px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .streak .pin{color:var(--ng)}
  .drop{
    font-family:inherit;font-size:.76rem;padding:4px 10px;
    background:var(--card);color:var(--ink-soft);border:1px solid var(--rule);
    border-radius:5px;cursor:pointer;
  }
  .drop:hover{border-color:var(--ng);color:var(--ng)}
  .cats{width:100%;border-collapse:collapse;font-size:.85rem;margin:0 0 22px}
  .cats th,.cats td{padding:6px 8px;border-bottom:1px dotted var(--rule);text-align:left}
  .cats th{font-weight:600;font-size:.78rem;color:var(--ink-soft);white-space:nowrap}
  .cats td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cats tr.hot td{color:var(--ng)}
  .sechead{font-size:.9rem;font-weight:600;margin:0 0 6px}
  .reviews{list-style:none;padding:0;margin:0 0 22px;font-size:.9rem}
  .reviews li{
    padding:8px 0;border-bottom:1px solid var(--rule);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .reviews .t{flex:1;min-width:12em}
  .reviews .c{color:var(--ink-soft);font-size:.8rem}
  .reviews .w{color:var(--ng);font-size:.8rem;font-variant-numeric:tabular-nums}

  /* ---------- ナビ ---------- */
  .nav{
    position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--rule);padding:12px 20px;
  }
  .nav-inner{max-width:820px;margin:0 auto;display:flex;gap:10px}
  button.btn{
    font-family:inherit;font-size:.9rem;padding:11px 16px;border-radius:5px;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--ink);
  }
  button.btn:hover:not(:disabled){border-color:var(--ai);color:var(--ai)}
  button.btn:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--ai);border-color:var(--ai);color:var(--on-ai);flex:1}
  button.primary:hover:not(:disabled){background:var(--ai-hover);border-color:var(--ai-hover);color:var(--on-ai)}
  .hint-key{font-size:.72rem;color:var(--ink-soft);text-align:center;margin-top:8px}

  /* ---------- 結果画面 ---------- */
  .final .big{font-family:var(--mincho);font-size:2.6rem;line-height:1.2;margin:6px 0 2px}
  .final .sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:22px}
  .wrongs{list-style:none;padding:0;margin:0;font-size:.9rem}
  .wrongs li{padding:8px 0;border-bottom:1px solid var(--rule)}
  .wrongs button{
    font-family:inherit;font-size:.9rem;text-align:left;background:none;border:0;
    color:var(--ai);cursor:pointer;padding:0;
  }
  .final .acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}

  @media (max-width:600px){
    .card{padding:20px 18px 22px}
    .body{font-size:1rem;line-height:2.1}
    main{padding:18px 14px 130px}
    .head-inner,.settings{padding-left:14px;padding-right:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="head-top">
      <h1>個人情報取扱主任者　一問一答</h1>
      <div class="score" id="score"></div>
    </div>
    <div class="bar" id="bar" role="progressbar" aria-label="解答の進捗"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
  </div>
  <div class="settings">
    <label>出題範囲
      <select id="scope"></select>
    </label>
    <label><input type="checkbox" id="shuffle"> 順番をシャッフル</label>
    <label><input type="checkbox" id="hint" checked> 空欄の幅を字数に合わせる</label>
    <button class="btn" id="restart" style="padding:4px 10px;font-size:.78rem">最初から</button>
    <button class="btn" id="reset-stats" style="padding:4px 10px;font-size:.78rem">記録をリセット</button>
  </div>
</header>

<main id="main"></main>

<div class="nav">
  <div class="nav-inner">
    <button class="btn" id="prev">前へ</button>
    <button class="btn primary" id="check">答え合わせ</button>
    <button class="btn" id="next">次へ</button>
  </div>
  <div class="hint-key">Enter＝答え合わせ／次へ　　←→＝問題の移動（入力中は Ctrl＋←→）　　○×問題は o／x</div>
</div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
